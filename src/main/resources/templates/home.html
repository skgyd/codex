<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인 홈</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>메인 홈페이지</h1>
    <a class="button" href="/posts/new">게시글 작성</a>

    <h2>최신 댓글 10개</h2>
    <ul class="list">
        <li th:if="${#lists.isEmpty(latestComments)}">아직 댓글이 없습니다.</li>
        <li th:each="comment : ${latestComments}">
            <a th:href="@{|/posts/${comment.postId}|}" th:text="${comment.content}"></a>
            <small th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
        </li>
    </ul>
</div>
</body>
</html>
